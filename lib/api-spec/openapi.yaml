openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Smart QR Restaurant Ordering System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: menu
    description: Menu operations
  - name: orders
    description: Order operations
  - name: queue
    description: Public queue operations
  - name: admin
    description: Admin operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /menu:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List all menu items
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"

  /menu/categories:
    get:
      operationId: listCategories
      tags: [menu]
      summary: List all menu categories
      responses:
        "200":
          description: List of category names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders (admin)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /queue:
    get:
      operationId: getQueue
      tags: [queue]
      summary: Get public live queue of active orders
      responses:
        "200":
          description: Active orders in queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueEntry"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/history:
    get:
      operationId: getAdminHistory
      tags: [admin]
      summary: Get date-wise sales history (delivered orders only)
      responses:
        "200":
          description: Daily sales records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailySalesRecord"
        "401":
          description: Unauthorized

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          description: Unauthorized

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "200":
          description: Logged out

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Get current admin session
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MenuItem:
      type: object
      required: [id, name, description, price, category, available]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
        category:
          type: string
        imageUrl:
          type: ["string", "null"]
        available:
          type: boolean
        isSpecial:
          type: boolean

    OrderItem:
      type: object
      required: [menuItemId, name, quantity, price]
      properties:
        menuItemId:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        price:
          type: number

    Order:
      type: object
      required: [id, tableNumber, items, subtotal, tax, total, status, paymentStatus, createdAt]
      properties:
        id:
          type: integer
        tableNumber:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: number
        tax:
          type: number
        total:
          type: number
        status:
          type: string
          enum: [order_received, payment_confirmed, accepted, preparing, ready, delivered, cancelled]
        paymentStatus:
          type: string
          enum: [pending, paid, refunded]
        notes:
          type: ["string", "null"]
        estimatedWaitMinutes:
          type: ["integer", "null"]
        createdAt:
          type: string

    OrderInput:
      type: object
      required: [tableNumber, items]
      properties:
        tableNumber:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
        notes:
          type: string

    OrderItemInput:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId:
          type: integer
        quantity:
          type: integer

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [order_received, payment_confirmed, accepted, preparing, ready, delivered, cancelled]
        paymentStatus:
          type: string
          enum: [pending, paid, refunded]
        estimatedWaitMinutes:
          type: integer

    QueueEntry:
      type: object
      required: [id, tableNumber, status, paymentStatus, queuePosition, createdAt]
      properties:
        id:
          type: integer
        tableNumber:
          type: integer
        status:
          type: string
        paymentStatus:
          type: string
        queuePosition:
          type: integer
        estimatedWaitMinutes:
          type: ["integer", "null"]
        createdAt:
          type: string

    AdminStats:
      type: object
      required: [totalOrders, activeOrders, totalRevenue, pendingPayments, ordersByStatus, recentOrders]
      properties:
        totalOrders:
          type: integer
        activeOrders:
          type: integer
        totalRevenue:
          type: number
        pendingPayments:
          type: integer
        ordersByStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    DailySalesRecord:
      type: object
      required: [date, totalOrders, totalRevenue]
      properties:
        date:
          type: string
          description: Date in YYYY-MM-DD format
        totalOrders:
          type: integer
        totalRevenue:
          type: number

    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AdminLoginResult:
      type: object
      required: [success, username, token]
      properties:
        success:
          type: boolean
        username:
          type: string
        token:
          type: string

    AdminSession:
      type: object
      required: [username]
      properties:
        username:
          type: string
